name: Publish to official MCP Registry (github-oidc)
on:
  push:
    branches: [main]
    paths: ['server.json']
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npx -y mcp-publisher login github-oidc && npx -y mcp-publisher publish
